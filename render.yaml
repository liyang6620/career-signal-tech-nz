services:
  - type: web
    name: careersignal-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODE
        value: hash
      - key: MALWARE_SCAN_MODE
        value: trusted_demo
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://career-signal-tech-nz.pages.dev,https://localhost
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INGESTION_API_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        value: career-signal-private
      - key: STORAGE_MANAGE_CORS
        value: "false"
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
