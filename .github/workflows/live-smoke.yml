name: Live Demo Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public web application
        shell: bash
        run: |
          set -euo pipefail
          base="https://career-signal-tech-nz.pages.dev"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "$base/" > /dev/null
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "$base/manifest.webmanifest" > /dev/null
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "$base/sw.js" > /dev/null
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 "$base/icons/app-icon-192.png" > /dev/null
      - name: Wake and check API
        shell: bash
        run: |
          set -euo pipefail
          api="https://careersignal-api-ze3r.onrender.com"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 --max-time 45 "$api/health" > /dev/null
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 45 "$api/ready" > /dev/null
