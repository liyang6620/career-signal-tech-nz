services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career_signal
      POSTGRES_USER: career_signal
      POSTGRES_PASSWORD: career_signal
    ports:
      - "5432:5432"
    volumes:
      - career_signal_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_signal -d career_signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://career_signal:career_signal@database:5432/career_signal
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-career-signal}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-development-storage-secret}
      CLAMAV_HOST: antivirus
      INGESTION_API_KEY: ${INGESTION_API_KEY:-development-ingestion-key}
      EMBEDDING_CACHE_PATH: /home/appuser/.cache/fastembed
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    volumes:
      - career_signal_models:/home/appuser/.cache/fastembed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://career_signal:career_signal@database:5432/career_signal
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-career-signal}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-development-storage-secret}
      CLAMAV_HOST: antivirus
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
      antivirus:
        condition: service_healthy
    restart: unless-stopped

  storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-career-signal}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-development-storage-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - career_signal_storage:/data

  antivirus:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  career_signal_data:
  career_signal_storage:
  clamav_data:
  career_signal_models:
