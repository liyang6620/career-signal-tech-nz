<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173a55" />
    <title>CareerSignal is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f6f7f8; color: #202b35; font: 16px/1.55 system-ui, sans-serif; }
      main { width: min(460px, 100%); padding: 32px; border: 1px solid #dfe4e7; background: #fff; }
      img { width: 52px; height: 52px; }
      h1 { margin: 22px 0 10px; font-size: 28px; line-height: 1.2; }
      p { margin: 0 0 24px; color: #667580; }
      button { min-height: 46px; padding: 0 18px; border: 1px solid #173a55; background: #173a55; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>CareerSignal needs a connection to load private evidence and current market data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
