services:
  api:
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      STARTUP_SUPERVISED: "false"
    volumes:
      - ./backend/app:/app/app:ro
      - career_signal_models:/home/appuser/.cache/fastembed
